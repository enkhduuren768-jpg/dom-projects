<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="min-h-screen min-w-[1000px] bg-[#101b16] font-sans text-[#f0fdf4]">
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#86efac]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#86efac]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#86efac] transition-colors hover:border-[#86efac]/35 hover:bg-[#86efac]/10 hover:text-[#f0fdf4] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#86efac] motion-reduce:transition-none"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#86efac]/65">The everyday collection / 02</span>
      </header>

      <div class="flex flex-1 items-center justify-center py-10">
        <div class="p-9 w-[520px] h-[571px] bg-[#192B22] border border-[#FFFFFF1A] rounded-3xl">
          <div class="w-[44px] h-[44px] bg-[#4ADE8026] rounded-xl flex justify-center items-center">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-lock-keyhole preview-icon"
            >
              <circle cx="12" cy="16" r="1" />
              <rect x="3" y="10" width="18" height="12" rx="2" />
              <path d="M7 10V7a5 5 0 0 1 10 0v3" />
            </svg>
          </div>
          <div class="text=[#F0FDF4] text-[28px] mt-[24px]">Password generator</div>
          <div class="text-[#A4B9AD] text-[14px]">A strong password. One click away.</div>
          <div class="text-[#A4B9AD] text-[12px] mt-[32px]">Your password</div>
          <div class="w-[448px] h-[64px] bg-[#101B16] mt-[12px] rounded-xl flex justify-between items-center pl-4 pr-3">
            <div id="show-generated-password" class="h-[24px] text-[#BBF7D0] ml-[16px]"></div>
            <div id="copy-generated-password" class="w-[55px] h-[31px] bg-[#FFFFFF0D] rounded-lg flex justify-center items-center translate duration-300 ease-in active:scale-90">Copy</div>
          </div>
          <div id="message" class="text-[#A4B9AD] text-[12px] mt-[12px]">Uses letters, numbers, and symbols.</div>
          <div class="w-[448px] h-[28px] flex justify-between mt-[26px]">
            <div class="text-[#DCECE2] text-[14px]">Password length</div>
            <div id="password-length-output" class="text-[18px] text-[#86EFAC]">16</div>
          </div>
          <input id="password-length-range-input" type="range" id="" min="8" max="24" value="16" class="w-full mt-[16px] accent-[#4ADE80]" />
          <div class="mt-4 flex justify-between text-xs text-[#8AA294]"><span>8</span><span>24</span></div>
          <button id="generate-password" class="w-md h-[48px] rounded-xl mt-[28px] bg-[#4ADE80] text-[#102418] translate duration-300 ease-in active:scale-90">Generate password</button>
          <div class="text-[#8AA294] flex justify-center items-center mt-[20.5px]">Generated in your browser. Never saved.</div>
        </div>
      </div>
    </div>
  </body>
</html>
