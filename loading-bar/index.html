<!DOCTYPE html>

  <body

    <div class="mx-auto flex min-h-screen w-[920px] flex-col">

        <nav>
          <a

            <svg

              stroke-linejoin="round"

              <path d="M19 12H5m7-7-7 7 7 7" />

        </nav>
        <span

      <div class="flex flex-1 items-center justify-center py-10 flex-col gap-6">

            <div

                <div

                <span class="text-[38px] text-[#FF6470] pt-20">%</span>

              <div id="message" class="text-[#C4A2AB] text-[14px]">
                Bringing everything together
              </div>

          </div>
          <div class="pl-[48px] pt-[12px]">
            <div class="bg-[#46232E] w-[624px] h-[12px] rounded-3xl m-[12px]">

          <div

            <div class="text-[#C4A2AB] text-[10px]">
              PREPARING YOUR EXPERIENCE
            </div>
            <div class="text-[#C4A2AB] text-[10px]">JUST A MOMENT</div>
          </div>

          <div
            class="bg-[#1E0C13] h-14 flex justify-center items-center mt-auto w-full overflow-hidden"
          >
            <div class="text-[#C4A2AB] text-[12px]">
              → Your welcome page will open automatically.
            </div>
          </div>
        </div>
      </div>
